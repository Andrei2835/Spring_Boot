<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Динамический заголовок во вкладке браузера -->
    <title>th:text="${title}</title>
</head>
<body>

<!-- Динамический заголовок на странице ("Новый пользователь" или "Редактирование пользователя") -->
<h2 th:text="${title}">begin page</h2>


<form th:action="@{|/api/users/${action}|}" th:object="${user}" method="post">



    <!-- Скрытое поле для id -->
    <input type="hidden" th:field="*{id}" />

    <div>
        <label for="name">name:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" />
    </div>
    <br>

    <div>
        <label for="age">age:</label>
        <input type="number" id="age" th:field="*{age}" min="0" max="120" />
    </div>
    <br>

    <div>
        <button type="submit">save</button>
    </div>

</form>

</body>
</html>
